<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본어 동사 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow study column — settings strip, a single word card, four answer tiles, progress below */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#1c2433; --muted:#5d6779; --line:#d6dce7;
  --ai:#2f4b9a; --ai-soft:#e3e9f7; --good:#1f8a5b; --good-soft:#dcf3e8; --bad:#c2413a; --bad-soft:#fbe4e2;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121722; --paper:#1b2230; --ink:#e7ebf3; --muted:#9aa4b6; --line:#2e3748;
  --ai:#8ea6f0; --ai-soft:#24304c; --good:#5fd09a; --good-soft:#173a2b; --bad:#f08a83; --bad-soft:#41201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722; --paper:#1b2230; --ink:#e7ebf3; --muted:#9aa4b6; --line:#2e3748;
  --ai:#8ea6f0; --ai-soft:#24304c; --good:#5fd09a; --good-soft:#173a2b; --bad:#f08a83; --bad-soft:#41201f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--jp);font-weight:900;font-size:1.5rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{font-family:var(--kr);font-weight:500;font-size:.85rem;color:var(--muted);margin-left:6px}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.score b{color:var(--ink)}
.settings{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .lab{font-size:.78rem;color:var(--muted);letter-spacing:.04em;min-width:52px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip small{color:var(--muted);font-size:.75rem;margin-left:3px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper);font-weight:700}
.chip[aria-pressed="true"] small{color:var(--paper);opacity:.8}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 20px 22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.qno{font-size:.78rem;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;color:var(--ai);background:var(--ai-soft);border-radius:6px;padding:2px 8px;font-weight:700}
.word{font-family:var(--jp);font-weight:700;font-size:2.6rem;line-height:1.2;overflow-wrap:anywhere}
.word.kr{font-family:var(--kr);font-size:2rem}
.reading{font-family:var(--jp);color:var(--muted);font-size:1.05rem;min-height:1.6em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:60px}
.opt .k{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt .t{min-width:0;font-weight:500}
.opt .t.jp{font-family:var(--jp);font-size:1.15rem}
.opt .t small{display:block;font-family:var(--jp);color:var(--muted);font-size:.8rem;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--ai)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.forms{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin:0}
.forms dt{color:var(--muted);font-size:.8rem;padding-top:2px}
.forms dd{margin:0;font-family:var(--jp);font-weight:500;min-width:0}
.forms dd span{color:var(--muted);font-weight:400;margin-left:6px;font-size:.85rem;font-family:var(--kr)}
.forms dd span.jpr{font-family:var(--jp)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:1.5px solid var(--ai);background:var(--ai);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ai)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ai);transition:width .3s}
.done{text-align:center;gap:12px}
.big{font-family:var(--jp);font-weight:900;font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.miss span{font-family:var(--jp);background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:.9rem}
.hint{font-size:.8rem;color:var(--muted);text-align:center}
.say{font:inherit;border:1px solid var(--line);background:var(--ai-soft);color:var(--ai);border-radius:999px;width:40px;height:40px;cursor:pointer;display:inline-grid;place-items:center;flex:none;padding:0}
.say.sm{width:28px;height:28px}
.say:hover{border-color:var(--ai)}
.say:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.forms dd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.forms dd span{margin-left:0}
.nosound{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>単語クイズ<small>일본어 단어 퀴즈</small></h1>
    <div class="score" id="score">맞힘 <b>0</b> / 0</div>
  </header>

  <section class="settings" aria-label="퀴즈 설정">
    <div class="row"><span class="lab">종류</span>
      <button class="chip" id="cat-v" data-cat="v" aria-pressed="true">동사<small></small></button>
      <button class="chip" id="cat-n" data-cat="n" aria-pressed="false">명사<small></small></button>
      <button class="chip" id="cat-p" data-cat="p" aria-pressed="false">조사<small></small></button>
      <button class="chip" id="cat-a" data-cat="a" aria-pressed="false">부사<small></small></button>
      <button class="chip" id="cat-all" data-cat="all" aria-pressed="false">전체<small></small></button>
    </div>
    <div class="row"><span class="lab">방향</span>
      <button class="chip" id="mode-jp" data-mode="jp" aria-pressed="true">일본어 → 뜻</button>
      <button class="chip" id="mode-kr" data-mode="kr" aria-pressed="false">뜻 → 일본어</button>
    </div>
    <div class="row"><span class="lab">문제 수</span>
      <button class="chip" id="n10" data-n="10" aria-pressed="true">10</button>
      <button class="chip" id="n20" data-n="20" aria-pressed="false">20</button>
      <button class="chip" id="n50" data-n="50" aria-pressed="false">50</button>
      <button class="chip" id="nall" data-n="999" aria-pressed="false">전부</button>
    </div>
    <div class="row"><span class="lab">읽는 법</span>
      <button class="chip" id="furi" aria-pressed="true">보이기</button>
    </div>
    <div class="row"><span class="lab">소리</span>
      <button class="chip" id="auto" aria-pressed="true">자동 재생</button>
      <button class="chip" id="slow" aria-pressed="false">천천히</button>
      <span class="nosound" id="nosound" hidden>이 브라우저는 발음 재생을 지원하지 않아요</span>
    </div>
  </section>

  <div class="bar" aria-hidden="true"><i id="prog" style="width:0%"></i></div>
  <main id="stage"></main>
  <p class="hint">키보드: 1–4로 고르고, Enter로 다음 문제</p>
</div>

["よく","よく","자주, 잘","よく映画を見ます。","자주 영화를 봐요."],
["いつも","いつも","항상, 늘","いつも忙しいです。","항상 바빠요."],
["時々","ときどき","가끔","時々走ります。","가끔 달려요."],
["たまに","たまに","어쩌다, 이따금","たまに料理します。","어쩌다 요리해요."],
["あまり","あまり","별로 (+부정)","あまり好きじゃないです。","별로 안 좋아해요."],
["全然","ぜんぜん","전혀 (+부정)","全然分かりません。","전혀 모르겠어요."],
["もう","もう","벌써, 이미","もう寝ます。","이제 잘게요."],
["まだ","まだ","아직","まだ始めていません。","아직 시작 안 했어요."],
["すぐ","すぐ","곧, 바로","すぐ行きます。","바로 갈게요."],
["ゆっくり","ゆっくり","천천히, 푹","ゆっくり休んでください。","푹 쉬세요."],
["もっと","もっと","더","もっと食べたいです。","더 먹고 싶어요."],
["一緒に","いっしょに","함께, 같이","一緒に行きましょう。","같이 가요."],
["一番","いちばん","가장, 제일","これが一番好きです。","이게 제일 좋아요."],
["本当に","ほんとうに","정말로","本当に疲れました。","정말 피곤해요."],
["やっぱり","やっぱり","역시","やっぱり忙しいです。","역시 바빠요."],
["たぶん","たぶん","아마","たぶん雨が降ります。","아마 비가 올 거예요."],
["きっと","きっと","분명히, 꼭","きっと大丈夫です。","분명 괜찮을 거예요."],
["ずっと","ずっと","계속, 훨씬","ずっと待っていました。","계속 기다렸어요."],
["また","また","또, 다시","また会いましょう。","또 만나요."],
["先に","さきに","먼저","先に帰ります。","먼저 갈게요."],
["早く","はやく","빨리, 일찍","早く寝ます。","일찍 자요."],
["全部","ぜんぶ","전부, 다","全部食べました。","다 먹었어요."],
["だいたい","だいたい","대체로, 대략","だいたい分かります。","대충 알아요."],
["ちょうど","ちょうど","딱, 마침","ちょうど12時です。","딱 12시예요."],
["なんだか","なんだか","왠지","なんだか眠いです。","왠지 졸려요."],
["特に","とくに","특히","特に猫が好きです。","특히 고양이를 좋아해요."],
["ほとんど","ほとんど","거의","ほとんど終わりました。","거의 끝났어요."]
];
const CAT={v:"동사",n:"명사",p:"조사",a:"부사"};
const ALL=[
  ...VERBS.map(x=>({c:"v",w:x[0],r:x[1],m:x[4],ms:x[2],msr:x[3]})),
  ...NOUNS.map(x=>({c:"n",w:x[0],r:x[1],m:x[2]})),
  ...PARTS.map(x=>({c:"p",w:x[0],r:x[1],m:x[2],ex:x[3],exm:x[4]})),
  ...ADVS.map(x=>({c:"a",w:x[0],r:x[1],m:x[2],ex:x[3],exm:x[4]}))
];
const toNeg=m=>m.replace(/ます$/,"ません");
let cat="v",mode="jp",N=10,furi=true,deck=[],i=0,right=0,missed=[],answered=false,cur=null;
// 발음: 브라우저 내장 음성(Web Speech API), 일본어 목소리 우선
let auto=true,slow=false,jaVoice=null;
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
function pickVoice(){if(!synth)return;const vs=synth.getVoices();
  jaVoice=vs.find(v=>/^ja/i.test(v.lang)&&/google|kyoko|haruka|nanami/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null}
if(synth){pickVoice();synth.addEventListener?.("voiceschanged",pickVoice)}
function say(t){if(!synth||!t)return;try{synth.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=slow?0.6:0.9;synth.speak(u)}catch(e){}}
const SPK=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const sayBtn=(t,sm)=>synth?`<button class="say${sm?" sm":""}" data-say="${t}" aria-label="발음 듣기">${SPK}</button>`:"";
if(!synth)document.getElementById("nosound").hidden=false;
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)say(b.dataset.say)});
const $=s=>document.querySelector(s), stage=$("#stage");
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const pool=()=>cat==="all"?ALL:ALL.filter(x=>x.c===cat);
const showR=x=>furi&&x.r!==x.w;

document.querySelectorAll("[data-cat]").forEach(b=>{const c=b.dataset.cat;
  b.querySelector("small").textContent=c==="all"?ALL.length:ALL.filter(x=>x.c===c).length});

function start(list){
  deck=list?shuffle(list):shuffle(pool()).slice(0,N);
  i=0;right=0;missed=[];render();
}
function render(){
  answered=false;
  $("#score").innerHTML=`맞힘 <b>${right}</b> / ${i}`;
  $("#prog").style.width=(i/deck.length*100)+"%";
  if(i>=deck.length) return finish();
  cur=deck[i];
  const same=ALL.filter(x=>x.c===cur.c&&x!==cur&&x.m!==cur.m&&x.w!==cur.w);
  const opts=shuffle([cur,...shuffle(same).slice(0,3)]);
  const tag=`<span class="tag">${CAT[cur.c]}</span>`;
  const q=mode==="jp"
    ? `<div class="word">${cur.w}</div><div class="reading">${showR(cur)?cur.r:""}</div>${sayBtn(cur.r)}`
    : `<div class="word kr">${cur.m}</div><div class="reading"></div>`;
  stage.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="card"><div class="qno">${i+1} / ${deck.length}</div>${tag}${q}</div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${ALL.indexOf(o)}"><span class="k">${k+1}</span>${
      mode==="jp"?`<span class="t">${o.m}</span>`:`<span class="t jp">${o.w}${showR(o)?`<small>${o.r}</small>`:""}</span>`}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  if(auto&&mode==="jp")say(cur.r);
}
function detail(x){
  let h=`<dt>${CAT[x.c]}</dt><dd>${sayBtn(x.r,1)}${x.w}<span class="jpr">${x.r!==x.w?x.r:""}</span><span>${x.m}</span></dd>`;
  if(x.c==="v") h+=`<dt>~ます</dt><dd>${sayBtn(x.msr,1)}${x.ms}<span class="jpr">${x.msr}</span></dd><dt>~ません</dt><dd>${sayBtn(toNeg(x.msr),1)}${toNeg(x.ms)}<span class="jpr">${toNeg(x.msr)}</span></dd>`;
  if(x.ex) h+=`<dt>예문</dt><dd>${sayBtn(x.ex,1)}${x.ex}<span>${x.exm}</span></dd>`;
  if(x.c==="p"&&x.r!==x.w) h+=`<dt>주의</dt><dd><span style="margin:0">조사일 때는 「${x.r}」로 읽어요</span></dd>`;
  return h;
}
function pick(b){
  if(answered)return; answered=true;
  const ok=ALL[+b.dataset.k]===cur;
  if(ok)right++; else missed.push(cur);
  stage.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(ALL[+o.dataset.k]===cur)o.classList.add("ok")});
  if(!ok)b.classList.add("no");
  i++;
  $("#score").innerHTML=`맞힘 <b>${right}</b> / ${i}`;
  $("#prog").style.width=(i/deck.length*100)+"%";
  $("#fb").innerHTML=`<div class="feedback">
    <div class="verdict ${ok?"ok":"no"}">${ok?"정답이에요!":"아쉬워요. 정답은 「"+cur.w+"」 "+cur.m}</div>
    <dl class="forms">${detail(cur)}</dl>
    <div class="actions"><button class="btn" id="next">${i>=deck.length?"결과 보기":"다음 문제"}</button></div></div>`;
  const n=$("#next"); n.onclick=render; n.focus();
  if(auto&&mode==="kr")say(cur.r);
}
function finish(){
  const pct=Math.round(right/deck.length*100);
  stage.innerHTML=`<div class="card done">
    <div class="qno">결과</div>
    <div class="big">${right}<span style="font-size:1.4rem;color:var(--muted)"> / ${deck.length}</span></div>
    <div>${pct===100?"완벽해요! 全問正解 🎉":pct>=80?"아주 잘했어요!":pct>=50?"절반 넘게 맞혔어요. 조금만 더!":"틀린 단어부터 다시 해 봐요."}</div>
    ${missed.length?`<div class="qno">틀린 단어</div><div class="miss">${missed.map(m=>`<span>${m.w} · ${m.m}</span>`).join("")}</div>`:""}
    <div class="actions" style="justify-content:center">
      ${missed.length?`<button class="btn" id="retry">틀린 것만 다시</button>`:""}
      <button class="btn ${missed.length?"ghost":""}" id="again">새로 시작</button></div></div>`;
  const r=$("#retry"); if(r)r.onclick=()=>start(missed.slice());
  $("#again").onclick=()=>start();
}
const group=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{fn(b);
  document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed",x===b));start()});
group("[data-cat]",b=>cat=b.dataset.cat);
group("[data-mode]",b=>mode=b.dataset.mode);
group("[data-n]",b=>N=+b.dataset.n);
$("#auto").onclick=e=>{auto=!auto;e.currentTarget.setAttribute("aria-pressed",auto)};
$("#slow").onclick=e=>{slow=!slow;e.currentTarget.setAttribute("aria-pressed",slow);if(cur)say(cur.r)};
$("#furi").onclick=e=>{furi=!furi;const t=e.currentTarget;t.setAttribute("aria-pressed",furi);t.textContent=furi?"보이기":"숨기기";if(!answered)render()};
document.addEventListener("keydown",e=>{
  if(/^[1-4]$/.test(e.key)&&!answered){const b=$("#opt"+(e.key-1));if(b)pick(b)}
  else if(e.key==="Enter"&&answered){if($("#next")){e.preventDefault();render()}}
});
start();
</script>

</body>
</html>
